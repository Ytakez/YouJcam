name: Restore folders
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore structure
        run: |
          for f in *__*; do
            [ -f "$f" ] || continue
            new="${f//__//}"
            mkdir -p "$(dirname "$new")"
            git mv "$f" "$new"
          done
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -m "Restore folder structure"
          git push
